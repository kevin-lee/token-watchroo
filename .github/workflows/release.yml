name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read by default. The release job alone gets contents: write, for the GitHub release.
permissions:
  contents: read

jobs:
  build:
    # Explicit, so the check name does not change when a matrix field is added or removed (build.yml's arrangement).
    name: build (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      # Each architecture builds on its own runner because Scala Native and swift build produce host-architecture
      # binaries. One architecture failing must not cancel the other: the surviving log tells whether a failure is
      # architecture-specific or common to both (claude-proxymate's lesson).
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            expected: arm64
            issue67rerun: false
          - runner: macos-26-intel
            arch: x64
            expected: x86_64
            issue67rerun: true
    runs-on: ${{ matrix.runner }}
    # Scala Native picks the GC yieldpoint mode at link time from this variable. The 0.5.12 GC loses a root of a thread
    # stopped by a trap-based yieldpoint, the release default, and frees live objects (#44, upstream
    # scala-native/scala-native#5046), so every binary is linked with conditional yieldpoints and build.sbt refuses to
    # load without the variable. Remove it with the guards in build.sbt when a Scala Native release fixes #5046.
    env:
      SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"
    steps:
      # sbt-dynver derives the version from the tag, so the full history is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      # A release is never shipped ad-hoc: the cask would hand every Homebrew user a Gatekeeper refusal.
      - name: Require release secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "error: repository secret $name is not set"
              exit 1
            fi
          done

      # A tag release publishes changelogs/<version>.md as the release note, so a missing file fails here rather than
      # after two notarization round trips.
      - name: Require the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="changelogs/$VERSION.md"
          if [ ! -f "$FILE" ]; then
            echo "error: $FILE not found"
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      # Before the tests, as in build.yml, so a test binary that dies has a proved link-time mode (#44) and the patched
      # RegistersCapture.h (#63), and a real fault can be told apart from a stale link. The tasks link the three test
      # binaries and the Test step's fresh sbt reuses those links. The archive and the bundle executable are checked
      # after bundleApp. --server runs sbt in the foreground instead of the sbtn client, here and in every sbt step of
      # this job: no background server is left behind for the bundle step to reuse with an identity-less environment.
      - name: Verify yieldpoint mode and register capture (test binaries)
        run: sbt --server "checkYieldpoints; checkRegistersCapture"

      # testFull, not test: in sbt 2 `test` is the cached task, and the v0.1.2 release ran 3 tests with it (#60).
      # GC_LOG_FILE is the only channel for GC output, and sbt --server keeps the test processes' stderr, so a failure
      # leaves both. A passing Test step takes about a minute after the link above.
      # x86_64 only: continue-on-error hands a failure to the next step, which judges it against #67's shapes. The job
      # still fails unless that step accepts the failure and BridgeSpec then passes on its rerun.
      - name: Test
        id: test
        timeout-minutes: 12
        continue-on-error: ${{ matrix.issue67rerun }}
        env:
          GC_LOG_FILE: ${{ github.workspace }}/test-evidence/gc.log
        run: |
          set -euo pipefail
          mkdir -p test-evidence
          sbt --server "core/testFull; providers/testFull; app/testFull" 2>&1 | tee test-evidence/attempt-1.log

      # x86_64 only, until #67 is fixed: BridgeSpec fails there in about one run in 20 with a NullPointerException, a
      # SIGSEGV at 0x0 or a 120 s hang, with small heaps. The first attempt's reports are kept, then the script accepts
      # the failure only when BridgeSpec is the one failed test and its failure is one of those shapes. Anything else
      # fails the release. Remove this step, the rerun, the issue67rerun field and scripts/check-issue-67-failure.sh with
      # build.yml's x86_64 tolerance when #67 is fixed.
      - name: Check the test failure against #67's shapes (x86_64)
        id: issue67
        if: steps.test.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p test-evidence/attempt-1-reports
          find target/out -path '*/test-reports/*.xml' -exec cp {} test-evidence/attempt-1-reports/ \;
          scripts/check-issue-67-failure.sh test-evidence/attempt-1.log test-evidence/attempt-1-reports
          echo "::warning title=#67 rerun::BridgeSpec failed with a #67 shape, so it is rerun once. The first attempt is in the test-evidence artifact."

      # testOnly reruns the suite every time. The last line makes sure the suite really ran, so a renamed suite cannot
      # pass with no tests. sbt colours the suite name, so the pattern allows escape codes around it.
      - name: Rerun BridgeSpec after a #67 failure (x86_64)
        if: steps.test.outcome == 'failure'
        timeout-minutes: 5
        env:
          GC_LOG_FILE: ${{ github.workspace }}/test-evidence/gc.log
        run: |
          set -euo pipefail
          sbt --server "app/testOnly tokenwatchroo.app.BridgeSpec" 2>&1 | tee test-evidence/attempt-2.log
          grep -q -E 'Test run .*tokenwatchroo\.app\.BridgeSpec.* finished: 0 failed, 0 ignored, [1-9][0-9]* total' test-evidence/attempt-2.log

      # After any test failure, including one the rerun recovered from, so every #67 trip in a release leaves its log,
      # reports and GC log. The attempt number keeps a re-run job from colliding with the failed job's artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        with:
          name: test-evidence-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: |
            test-evidence/
            target/out/**/test-reports/*.xml

      # The Swift shell tests link the static library that swiftTest stages and gates itself, so they run before the
      # signing certificate is imported. build.yml runs them too, but a release does not rely on a Build of its commit.
      - name: Swift tests
        run: sbt --server swiftTest

      # The certificate is imported only after the tests, so the keychain is unlocked for as few steps as possible.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci-import-certificate.sh

      # TW_SIGNING_IDENTITY is in the job environment from the certificate import step. It only reaches bundle-app.sh
      # when sbt runs the task in a JVM started by this step: an sbt 2 background server keeps the environment of
      # whichever invocation started it, so a reused one would silently produce an ad-hoc signature. --server runs sbt
      # in the foreground with this step's environment.
      - name: Bundle (Developer ID)
        run: sbt --server bundleApp

      # The staged archive and the bundle executable, which exist only once bundleApp has run (#44, #63). The three test
      # binaries were checked before the Test step, as in build.yml.
      - name: Verify yieldpoint mode and register capture (bundle)
        run: |
          set -euo pipefail
          scripts/check-yieldpoints.sh conditional swift/lib/libtokenwatchroo.a "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo"
          scripts/check-registers-capture.sh swift/lib/libtokenwatchroo.a "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo"

      # Two notary round trips take minutes, so an ad-hoc or unsigned bundle fails here rather than there.
      - name: Check the app signature
        run: |
          set -euo pipefail
          APP="dist/Token Watchroo.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep "Authority=Developer ID Application"
          codesign -dvvv "$APP" 2>&1 | grep "flags=.*runtime"
          codesign -dvvv "$APP" 2>&1 | grep "^Timestamp="

      - name: Write the notary API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Notarize the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/notarize.sh "dist/Token Watchroo.app"

      - name: Make the DMG
        run: scripts/make-dmg.sh "dist/Token Watchroo.app" dist

      - name: Notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMGS=(dist/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "error: expected exactly one DMG, got: ${DMGS[*]}"
            exit 1
          fi
          scripts/notarize.sh "${DMGS[0]}"

      # After stapling, never before: xcrun stapler rewrites the image to embed the ticket, so a checksum taken in
      # make-dmg.sh would not match the bytes that are published.
      - name: Write the DMG checksum
        run: |
          set -euo pipefail
          DMGS=(dist/*.dmg)
          scripts/checksum.sh "${DMGS[0]}"

      # Fail the release if the app inside the image is not Developer ID signed with hardened runtime, accepted by
      # Gatekeeper, stapled, built for this runner's architecture, linked with conditional GC yieldpoints (#44), and
      # compiled with the patched RegistersCapture.h (#63).
      - name: Verify the DMG
        run: |
          set -euo pipefail
          DMGS=(dist/*.dmg)
          DMG="${DMGS[0]}"
          hdiutil verify "$DMG"
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF}')
          trap 'hdiutil detach "$MNT" -quiet' EXIT
          APP="$MNT/Token Watchroo.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep "Authority=Developer ID Application"
          codesign -dvvv "$APP" 2>&1 | grep "flags=.*runtime"
          spctl --assess --type execute -vvv "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          file "$APP/Contents/MacOS/TokenWatchroo" | grep -q "${{ matrix.expected }}"
          scripts/check-yieldpoints.sh conditional "$APP/Contents/MacOS/TokenWatchroo"
          scripts/check-registers-capture.sh "$APP/Contents/MacOS/TokenWatchroo"
          (cd dist && shasum -a 256 -c ./*.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "${TW_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$TW_SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # For changelogs/<version>.md, which becomes the release note. No history needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the DMGs and their checksums: a build job that hit a test failure also uploads test evidence.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Check the artifacts
        run: |
          set -euo pipefail
          ls -la artifacts
          for arch in arm64 x64; do
            # shellcheck disable=SC2012
            COUNT=$(ls artifacts/Token-Watchroo-*-"$arch".dmg 2>/dev/null | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "error: expected exactly one $arch DMG, found $COUNT"
              exit 1
            fi
          done
          (cd artifacts && sha256sum -c ./*.sha256)

      - name: Locate the changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="changelogs/$VERSION.md"
          if [ ! -f "$FILE" ]; then
            echo "error: $FILE not found"
            exit 1
          fi
          echo "CHANGELOG_FILE=$FILE" >> "$GITHUB_ENV"

      # body_path wins over body, and with generate_release_notes the changelog is pre-pended to the generated notes.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.sha256
          body_path: ${{ env.CHANGELOG_FILE }}
          generate_release_notes: true

  tap:
    needs: release
    # brew style needs Homebrew.
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Require the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "error: repository secret HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi

      # This repository, for scripts/update-cask.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevin-lee/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Only the DMGs and their checksums: a build job that hit a test failure also uploads test evidence.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Update the cask
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARM="$(awk '{print $1}' "artifacts/Token-Watchroo-$VERSION-arm64.dmg.sha256")"
          X64="$(awk '{print $1}' "artifacts/Token-Watchroo-$VERSION-x64.dmg.sha256")"
          scripts/update-cask.sh "$VERSION" "$ARM" "$X64" tap

      # brew style only inspects casks that live inside a tap directory, so the checkout is linked into Homebrew's
      # taps folder under the real tap name and the casks are named by token.
      - name: Check the cask style
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/kevin-lee/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$TAP_DIR"
          TOKENS=()
          for cask in tap/Casks/token-watchroo*.rb; do
            TOKENS+=("kevin-lee/tap/$(basename "$cask" .rb)")
          done
          brew style --cask "${TOKENS[@]}"

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          VERSION="${GITHUB_REF_NAME#v}"
          MESSAGE="Update \`token-watchroo\` to \`$VERSION\`"
          PREVIOUS_FILE=$(git diff --cached --name-only --diff-filter=A | grep 'Casks/token-watchroo@' | sort -V | tail -n 1 || true)
          if [ -n "$PREVIOUS_FILE" ]; then
            PREVIOUS=$(basename "$PREVIOUS_FILE" .rb)
            PREVIOUS="${PREVIOUS#token-watchroo@}"
            MESSAGE="$MESSAGE and add versioned cask for \`$PREVIOUS\`"
          fi
          git commit -m "$MESSAGE"
          git push origin HEAD:main
