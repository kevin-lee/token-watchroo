# Temporary (#117, scala-native/scala-native#5393): run the standalone scala-cli reproducer on GitHub's Intel macOS
# and Apple Silicon runners: Minimal.scala, trap-based against conditional GC yieldpoints. Not for merging.
name: issue-117-scala-cli-repro

on:
  push:
    branches: [tmp/issue-117-scala-cli-repro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.arch }} ${{ matrix.arm }} ${{ matrix.child }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: macos-26-intel, arm: trap, child: empty }
          - { arch: x86_64, runner: macos-26-intel, arm: trap, child: alloc }
          - { arch: x86_64, runner: macos-26-intel, arm: trap, child: sleep }
          - { arch: x86_64, runner: macos-26-intel, arm: conditional, child: empty }
          - { arch: x86_64, runner: macos-26-intel, arm: conditional, child: sleep }
          - { arch: arm64, runner: macos-26, arm: trap, child: empty }
          - { arch: arm64, runner: macos-26, arm: trap, child: sleep }
    env:
      REPRO_DIR: tmp/issue-117-scala-cli-repro
      RUNS: 20
      SECONDS_PER_RUN: 20
      TIMEOUT_PER_RUN: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scala-cli 1.19.0
        run: |
          case "$(uname -m)" in
            x86_64) asset=scala-cli-x86_64-apple-darwin.gz ;;
            arm64) asset=scala-cli-aarch64-apple-darwin.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/VirtusLab/scala-cli/releases/download/v1.19.0/$asset" | gunzip > "$RUNNER_TEMP/bin/scala-cli"
          chmod +x "$RUNNER_TEMP/bin/scala-cli"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcrun clang --version | head -1
          scala-cli version

      - name: Build
        timeout-minutes: 15
        run: '"$REPRO_DIR/build.sh" "${{ matrix.arm }}" host Minimal.scala'

      - name: Run
        id: run
        run: |
          rm -f ~/Library/Logs/DiagnosticReports/minimal-* 2>/dev/null || true
          "$REPRO_DIR/run.sh" "$REPRO_DIR/bin/minimal-${{ matrix.arm }}-host" "$RUNS" "$SECONDS_PER_RUN" "$TIMEOUT_PER_RUN" "${{ matrix.child }}" | tee "$RUNNER_TEMP/run.txt"
          summary=$(grep '^summary ' "$RUNNER_TEMP/run.txt")
          echo "${{ matrix.arch }} ${{ matrix.arm }} ${{ matrix.child }}: $summary" >> "$GITHUB_STEP_SUMMARY"
          faults=$(echo "$summary" | sed -E 's/.* sigill=([0-9]+) hang=([0-9]+) other=([0-9]+).*/\1 \2 \3/' | awk '{print $1 + $2 + $3}')
          echo "faults=$faults" >> "$GITHUB_OUTPUT"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "$REPRO_DIR/logs/crash-reports"
          cp ~/Library/Logs/DiagnosticReports/minimal-* "$REPRO_DIR/logs/crash-reports/" 2>/dev/null || true
          ls -l "$REPRO_DIR/logs/crash-reports"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-${{ matrix.arch }}-${{ matrix.arm }}-${{ matrix.child }}
          path: ${{ env.REPRO_DIR }}/logs
          retention-days: 14

      - name: Fail on a fault
        if: steps.run.outputs.faults != '0'
        run: |
          echo "faults: ${{ steps.run.outputs.faults }}"
          exit 1
