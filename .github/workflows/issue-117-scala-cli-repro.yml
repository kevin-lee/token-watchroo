# Temporary (#117, scala-native/scala-native#5393): run the standalone scala-cli reproducer on GitHub's Intel macOS
# runners with trap-based GC yieldpoints, one set of thread roles per job, to find which roles fault. Not for merging.
name: issue-117-scala-cli-repro

on:
  push:
    branches: [tmp/issue-117-scala-cli-repro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: x86_64 trap ${{ matrix.id }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: default, roles: '' }
          - { id: no-spawn, roles: 'gc,alloc*4,sleep,handoff' }
          - { id: no-handoff, roles: 'gc,alloc*4,sleep,spawn' }
          - { id: no-sleep, roles: 'gc,alloc*4,handoff,spawn' }
          - { id: one-alloc, roles: 'gc,alloc,sleep,handoff,spawn' }
          - { id: no-alloc, roles: 'gc,sleep,handoff,spawn' }
          - { id: no-gc, roles: 'alloc*4,sleep,handoff,spawn' }
          - { id: gc-alloc4-spawn, roles: 'gc,alloc*4,spawn' }
          - { id: gc-spawn, roles: 'gc,spawn' }
          - { id: gc-alloc4, roles: 'gc,alloc*4' }
    env:
      REPRO_DIR: tmp/issue-117-scala-cli-repro
      RUNS: 20
      SECONDS_PER_RUN: 20
      TIMEOUT_PER_RUN: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scala-cli 1.19.0
        run: |
          case "$(uname -m)" in
            x86_64) asset=scala-cli-x86_64-apple-darwin.gz ;;
            arm64) asset=scala-cli-aarch64-apple-darwin.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/VirtusLab/scala-cli/releases/download/v1.19.0/$asset" | gunzip > "$RUNNER_TEMP/bin/scala-cli"
          chmod +x "$RUNNER_TEMP/bin/scala-cli"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcrun clang --version | head -1
          scala-cli version

      - name: Build
        timeout-minutes: 15
        run: '"$REPRO_DIR/build.sh" trap host'

      - name: Run
        id: run
        run: |
          rm -f ~/Library/Logs/DiagnosticReports/repro-* 2>/dev/null || true
          "$REPRO_DIR/run.sh" "$REPRO_DIR/bin/repro-trap-host" "$RUNS" "$SECONDS_PER_RUN" "$TIMEOUT_PER_RUN" "${{ matrix.roles }}" | tee "$RUNNER_TEMP/run.txt"
          summary=$(grep '^summary ' "$RUNNER_TEMP/run.txt")
          echo "x86_64 trap ${{ matrix.id }}: $summary" >> "$GITHUB_STEP_SUMMARY"
          faults=$(echo "$summary" | sed -E 's/.* sigill=([0-9]+) hang=([0-9]+) other=([0-9]+).*/\1 \2 \3/' | awk '{print $1 + $2 + $3}')
          echo "faults=$faults" >> "$GITHUB_OUTPUT"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "$REPRO_DIR/logs/crash-reports"
          cp ~/Library/Logs/DiagnosticReports/repro-* "$REPRO_DIR/logs/crash-reports/" 2>/dev/null || true
          ls -l "$REPRO_DIR/logs/crash-reports"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-x86_64-trap-${{ matrix.id }}
          path: ${{ env.REPRO_DIR }}/logs
          retention-days: 14

      - name: Fail on a fault
        if: steps.run.outputs.faults != '0'
        run: |
          echo "faults: ${{ steps.run.outputs.faults }}"
          exit 1
