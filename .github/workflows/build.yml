name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow needs nothing beyond reading the repository.
permissions:
  contents: read

jobs:
  build:
    # Explicit, so the check name does not change when a matrix field is added or removed: GitHub appends every matrix
    # value to the default job name, which turned `tolerated` into part of the name.
    name: build (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      # Each architecture builds on its own runner because Scala Native and swift build produce host-architecture
      # binaries. One architecture failing must not cancel the other: the surviving log tells whether a failure is
      # architecture-specific or common to both (release.yml's arrangement). x86_64 is here because it used to be
      # exercised only by release.yml, so the first x86_64 run of the test suite happened after a tag existed (#61).
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            expected: arm64
            tolerated: false
          - runner: macos-26-intel
            arch: x64
            expected: x86_64
            tolerated: true
    runs-on: ${{ matrix.runner }}
    # x86_64 is tolerated until the storm suites have no residual there: #63 and #65 are fixed, and the remaining
    # faults, a NullPointerException, a SIGSEGV at 0x0 or a 120 s hang in BridgeSpec with small heaps, are #67. It is
    # tolerated rather than removed: main stays honest about arm64 while an x86_64 failure stays visible in the job
    # list. Remove `tolerated` and this line when #67 is fixed, together with release.yml's #67 rerun and
    # scripts/check-issue-67-failure.sh. The key is not hyphenated because an expression would read `matrix.a-b` as
    # subtraction.
    continue-on-error: ${{ matrix.tolerated }}
    # A passing build takes about 10 minutes. The limit ends a hung run early instead of holding the runner for the 6-hour default.
    timeout-minutes: 20
    # Scala Native picks the GC yieldpoint mode at link time from this variable. The 0.5.12 GC loses a root of a thread
    # stopped by a trap-based yieldpoint, the release default, and frees live objects (#44, upstream
    # scala-native/scala-native#5046), so every binary is linked with conditional yieldpoints. build.sbt sets the
    # variable to 0 in the sbt server's own environment when it is unset (#72), and CI sets it here anyway, so no CI
    # link depends on that. Remove it with the guards in build.sbt when a Scala Native release fixes #5046.
    env:
      SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"
    steps:
      # sbt-dynver derives the version from the nearest tag, so the full history is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      # The one sbt call without the job's SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS, so CI runs the path a developer gets:
      # build.sbt sets the variable to 0 in the sbt server's own environment, which needs the --add-opens option in
      # .sbtopts (#72). A runner, JDK or sbt script change that breaks it makes the load refuse and fails this step.
      # --server runs sbt in the foreground and --batch ends it on a load failure, so no server without the job's
      # variable is left for the later steps.
      - name: Load without the yieldpoint variable
        run: |
          set -euo pipefail
          env -u SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS sbt --server --batch projects 2>&1 | tee "$RUNNER_TEMP/load-without-variable.log"
          grep -F 'so the build set it to 0 in the environment of this sbt server' "$RUNNER_TEMP/load-without-variable.log"

      # Before the tests, so a test binary that dies has a proved link-time mode and a real fault can be told apart from
      # a stale trap-based link (#44, #61) or from a build that lost the patched RegistersCapture.h (#63). The tasks link
      # the three test binaries themselves and the Test step reuses those links, so the earlier position costs no extra
      # linking. The staged archive and the bundle executable cannot be checked here because bundleApp has not run yet:
      # they are checked in the later step.
      - name: Verify yieldpoint mode and register capture (test binaries)
        run: sbt "checkYieldpoints; checkRegistersCapture"

      # core is hedgehog, providers and app are munit, all on Scala Native, which needs macOS.
      # testFull, not test: in sbt 2 `test` is the cached task and runs nothing on a warm disk cache, so a green Build
      # used to mean the suite had not run rather than that it had passed (#60, #61).
      # --server runs this sbt in the foreground, as in release.yml. The server that the step above started in the
      # background sends the test processes' stdout and stderr to /dev/null and keeps that step's environment, so it
      # would lose a failed assertion's diff and an Unhandled signal line, and never see GC_LOG_FILE, the only channel
      # for GC output (#73). The foreground sbt runs beside that idle server and reuses its links, and the later steps
      # go on using the server. A passing Test step takes under a minute. A hung test fails this step instead of using
      # the whole job limit.
      # A green run uploads nothing, so the last two lines prove both channels instead: the GC opened its log, which
      # stays empty when the GC has nothing to say, and the log has munit's own lines, kept only by a foreground sbt.
      - name: Test
        id: test
        timeout-minutes: 12
        env:
          GC_LOG_FILE: ${{ github.workspace }}/test-evidence/gc.log
        run: |
          set -euo pipefail
          mkdir -p test-evidence
          sbt --server "core/testFull; providers/testFull; app/testFull" 2>&1 | tee test-evidence/test.log
          test -f "$GC_LOG_FILE" || { echo "::error title=No GC log (#73)::GC_LOG_FILE did not reach the test processes"; exit 1; }
          grep -q -E 'Test run .* finished: ' test-evidence/test.log || { echo "::error title=No test process output (#73)::the log has no line written by a test process"; exit 1; }

      # After a test failure, including a hang that hit the step limit: the sbt log with the test processes' own output
      # and exit lines, the GC log, and the JUnit reports, which name each test case where the log names only the failed
      # suite. x86_64's job-level continue-on-error does not skip this step. The attempt number keeps a re-run job from
      # colliding with the failed job's artifact (release.yml's arrangement).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        with:
          name: test-evidence-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: |
            test-evidence/
            target/out/**/test-reports/*.xml

      - name: Bundle (ad-hoc)
        run: sbt bundleApp

      # The staged archive and the bundle executable, which exist only once bundleApp has run. The three test binaries
      # are checked before the Test step above. Both scripts need the GC to be present, so an empty or wrong file cannot
      # pass (#44, #63).
      - name: Verify yieldpoint mode and register capture (bundle)
        run: |
          set -euo pipefail
          scripts/check-yieldpoints.sh conditional swift/lib/libtokenwatchroo.a "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo"
          scripts/check-registers-capture.sh swift/lib/libtokenwatchroo.a "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo"

      # The Swift shell tests link the static library that bundleApp staged.
      - name: Swift tests
        run: sbt swiftTest

      - name: Verify bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "dist/Token Watchroo.app"
          plutil -p "dist/Token Watchroo.app/Contents/Info.plist"
          # The bundle versions stay period-separated integers (Apple's format, and Sparkle (#71) compares
          # CFBundleVersion), and the full sbt-dynver version the About panel shows starts with them (#77).
          PLIST="dist/Token Watchroo.app/Contents/Info.plist"
          FULL=$(plutil -extract TokenWatchrooVersion raw "$PLIST")
          SHORT=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          if ! [[ "$SHORT" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "error: CFBundleShortVersionString is not period-separated integers: $SHORT"
            exit 1
          fi
          if [ "$BUILD" != "$SHORT" ]; then
            echo "error: CFBundleVersion $BUILD differs from CFBundleShortVersionString $SHORT"
            exit 1
          fi
          if [ -z "$FULL" ] || [[ "$FULL" != "$SHORT"* ]]; then
            echo "error: TokenWatchrooVersion '$FULL' does not start with CFBundleShortVersionString $SHORT"
            exit 1
          fi
          file "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo" | grep -q "${{ matrix.expected }}"

      # A directory artifact would drop the symlinks and modes inside the bundle.
      - name: Zip bundle
        run: ditto -c -k --keepParent "dist/Token Watchroo.app" "dist/Token-Watchroo-adhoc-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-watchroo-adhoc-${{ matrix.arch }}
          path: dist/Token-Watchroo-adhoc-${{ matrix.arch }}.zip
