name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow needs nothing beyond reading the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    # A passing build takes about 5 minutes. The limit ends a hung run early instead of holding the runner for the 6-hour default.
    timeout-minutes: 12
    # Scala Native picks the GC yieldpoint mode at link time from this variable. The 0.5.12 GC loses a root of a thread
    # stopped by a trap-based yieldpoint, the release default, and frees live objects (#44, upstream
    # scala-native/scala-native#5046), so every binary is linked with conditional yieldpoints and build.sbt refuses to
    # load without the variable. Remove it with the guards in build.sbt when a Scala Native release fixes #5046.
    env:
      SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"
    steps:
      # sbt-dynver derives the version from the nearest tag, so the full history is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      # core is hedgehog, providers and app are munit, all on Scala Native, which needs macOS.
      # A passing Test step takes about 3 minutes. A hung test fails this step instead of using the whole job limit.
      - name: Test
        timeout-minutes: 8
        run: sbt "core/test; providers/test; app/test"

      # The Scala Native test runner names only the failed suite in the log. The JUnit reports name each test case.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports
          path: target/out/**/test-reports/*.xml

      - name: Bundle (ad-hoc)
        run: sbt bundleApp

      # The link-time mode is proved on the binaries themselves: the three test binaries through sbt, the staged archive
      # and the bundle executable through the script. The script requires the GC to be present, so an empty or wrong
      # file cannot pass (#44).
      - name: Verify yieldpoint mode
        run: |
          set -euo pipefail
          sbt checkYieldpoints
          scripts/check-yieldpoints.sh conditional swift/lib/libtokenwatchroo.a "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo"

      # The Swift shell tests link the static library that bundleApp staged.
      - name: Swift tests
        run: sbt swiftTest

      - name: Verify bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "dist/Token Watchroo.app"
          plutil -p "dist/Token Watchroo.app/Contents/Info.plist"
          file "dist/Token Watchroo.app/Contents/MacOS/TokenWatchroo" | grep -q arm64

      # A directory artifact would drop the symlinks and modes inside the bundle.
      - name: Zip bundle
        run: ditto -c -k --keepParent "dist/Token Watchroo.app" "dist/Token-Watchroo-adhoc-arm64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-watchroo-adhoc-arm64
          path: dist/Token-Watchroo-adhoc-arm64.zip
