# Token Watchroo messages, Korean (#10). UTF-8. One key = value per line, placeholders are {name}.
# Every key of MessageKey must be here, and no other key. Keep the order of messages_en.properties.
# Put a noun right after {agent} and {cli}, so no particle depends on a name.

# Window words
window.describe.session = 5시간 한도
window.describe.weekly = 주간 한도
window.describe.model = 주간 {model} 한도
window.limit.session = 세션
window.limit.weekly = 주간
window.limit.model = 주간 {model}

# Notifications
alert.title.almostOut = {agent} 사용량 거의 소진
alert.title.near = {agent} {limit} 한도 임박
alert.title.reset = {agent} {limit} 한도 초기화
alert.body.used = {window}의 {percent} 사용.
alert.body.fresh = 새 {window}를 사용할 수 있습니다.
alert.resetsIn = {duration} 후 초기화됩니다.
alert.resetsSoon = 곧 초기화됩니다.
alert.title.spend.almostOut.budget = {agent} 월 예산 거의 소진
alert.title.spend.almostOut.credits = {agent} 크레딧 거의 소진
alert.title.spend.near.budget = {agent} 월 예산 한도 임박
alert.title.spend.near.credits = {agent} 크레딧 한도 임박
alert.body.spend = {summary}, {percent}.
alert.title.spendReset.budget = {agent} 예산 초기화
alert.title.spendReset.credits = {agent} 크레딧 초기화
alert.body.spendReset.budget = 새 월 예산을 사용할 수 있습니다.
alert.body.spendReset.credits = 크레딧 한도를 다시 사용할 수 있습니다.
spend.summary.currency = {limit} 중 {spent} 사용
spend.summary.credits = {limit} 크레딧 중 {spent} 사용

# Durations
duration.underMinute = 1분 미만
duration.minute.one = 1분
duration.minute.other = {n}분
duration.hour.one = 1시간
duration.hour.other = {n}시간
duration.day.one = 1일
duration.day.other = {n}일

# Card texts
error.notSignedIn = 로그인되어 있지 않습니다. {cli} 명령을 한 번 실행하세요.
error.accessDenied = 키체인 접근이 거부되었습니다. macOS가 물으면 '항상 허용'을 클릭하세요.
error.tokenExpired = 토큰이 만료되었습니다(HTTP {status}). {cli} 명령으로 다시 로그인하세요.
error.rateLimited = 사용량 API 요청 한도에 걸렸습니다. 다음 새로 고침에 다시 시도합니다.
error.http = 사용량 API 오류 HTTP {status}
error.network = 네트워크 오류: {detail}
error.decode = 예상하지 못한 응답: {detail}
error.timeout = 인증 정보를 읽는 중 시간이 초과되었습니다
error.noUsageLimit = 사용량 API가 사용량 한도를 보고하지 않았습니다
error.apiNotSupported = API 예산 에이전트는 아직 지원하지 않습니다
error.unknown = 알 수 없는 오류
credentials.unreadable = 인증 정보를 읽을 수 없습니다: {detail}
credentials.claude.noSignIn = 키체인 항목에 Claude 로그인 정보가 없습니다(MCP 상태만 있음). claude를 실행하고 /login으로 로그인하세요.
credentials.claude.signInExpired = Claude Code 로그인이 만료되었습니다. claude를 실행하고 /login으로 다시 로그인하세요.
credentials.claude.noAccessToken = 키체인 항목에 액세스 토큰이 없습니다. claude를 실행해 로그인하세요.
credentials.claude.tokenExpired = Claude Code 토큰이 만료되었습니다. claude를 실행해 다시 로그인하세요.
credentials.claude.noProfileScope = Claude Code 토큰으로 사용량을 읽을 수 없습니다(user:profile 범위 없음). claude를 실행하고 /login으로 다시 로그인하세요.
credentials.claude.configDirNoSignIn = 설정의 구성 폴더에 대한 Claude Code 로그인이 없습니다. 폴더를 확인하거나 /login을 사용하세요.
credentials.claude.configDirUnreadable = 설정의 구성 폴더를 읽을 수 없습니다: {reason}
credentials.codex.apiKeyMode = Codex가 API 키 모드입니다. v1에서는 지원하지 않습니다.
credentials.codex.noAccessToken = Codex 인증 파일에 액세스 토큰이 없습니다. codex를 실행해 로그인하세요.
credentials.codex.homeMissing = Codex 홈 디렉터리를 찾을 수 없습니다: HOME이 설정되지 않았습니다.
credentials.fileUnreadable = {file} 파일을 읽을 수 없습니다: {detail}
credentials.securityFailed = security 명령이 {code} 코드로 종료되었습니다: {output}
credentials.processFailed = {command} 명령을 실행할 수 없습니다: {detail}
codex.compressedLog = {error}. 최신 Codex 로그가 압축되어 있어 7일보다 오래되었습니다.
