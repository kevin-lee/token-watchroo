# Token Watchroo messages, English (#10). UTF-8. One key = value per line, placeholders are {name}.
# Every key of MessageKey must be here, and no other key. Keep the order of messages_ko.properties.

# Window words
window.describe.session = 5 h window
window.describe.weekly = weekly window
window.describe.model = weekly {model} window
window.limit.session = session
window.limit.weekly = weekly
window.limit.model = weekly {model}

# Notifications
alert.title.almostOut = {agent} is almost out
alert.title.near = {agent} is near its {limit} limit
alert.title.reset = {agent} {limit} reset
alert.body.used = {percent} of the {window} used.
alert.body.fresh = A fresh {window} is available.
alert.resetsIn = Resets in {duration}.
alert.resetsSoon = Resets in under a minute.
alert.title.spend.almostOut.budget = {agent} is almost out of its monthly budget
alert.title.spend.almostOut.credits = {agent} is almost out of its credits
alert.title.spend.near.budget = {agent} is near its monthly budget
alert.title.spend.near.credits = {agent} is near its credit limit
alert.body.spend = {summary}, {percent}.
alert.title.spendReset.budget = {agent} budget reset
alert.title.spendReset.credits = {agent} credits reset
alert.body.spendReset.budget = A fresh monthly budget is available.
alert.body.spendReset.credits = The credit limit is available again.
spend.summary.currency = {spent} of {limit} spent
spend.summary.credits = {spent} of {limit} credits spent

# Durations
duration.underMinute = under a minute
duration.minute.one = 1 minute
duration.minute.other = {n} minutes
duration.hour.one = 1 hour
duration.hour.other = {n} hours
duration.day.one = 1 day
duration.day.other = {n} days

# Card texts
error.notSignedIn = Not signed in. Run {cli} once.
error.accessDenied = Keychain access denied. Click Always Allow when macOS asks.
error.tokenExpired = Token expired (HTTP {status}). Run {cli} to sign in again.
error.rateLimited = Usage API rate limited. Retrying next refresh.
error.http = Usage API error HTTP {status}
error.network = Network error: {detail}
error.decode = Unexpected response: {detail}
error.timeout = Timed out reading credentials
error.noUsageLimit = No usage limit reported by the usage API
error.apiNotSupported = API budget agents are not supported yet
error.unknown = Unknown error
credentials.unreadable = Credentials unreadable: {detail}
credentials.claude.noSignIn = Keychain item has no Claude sign-in (only MCP state). Run claude and use /login to sign in.
credentials.claude.signInExpired = Claude Code sign-in expired. Run claude and use /login to sign in again.
credentials.claude.noAccessToken = Keychain item has no access token. Run claude to sign in.
credentials.claude.tokenExpired = Claude Code token expired. Run claude to sign in again.
credentials.claude.noProfileScope = Claude Code token cannot read usage (no user:profile scope). Run claude and use /login to sign in again.
credentials.claude.configDirNoSignIn = No Claude Code sign-in for the Config folder in Settings. Check the folder or use /login.
credentials.claude.configDirUnreadable = Config folder in Settings cannot be read: {reason}
credentials.codex.apiKeyMode = Codex is in API-key mode, not supported in v1.
credentials.codex.noAccessToken = Codex auth file has no access token. Run codex to sign in.
credentials.codex.homeMissing = Cannot locate the Codex home directory: HOME is not set.
credentials.fileUnreadable = Cannot read {file}: {detail}
credentials.securityFailed = security exited with {code}: {output}
credentials.processFailed = Could not run {command}: {detail}
codex.compressedLog = {error}. The newest Codex log is compressed, so it is more than 7 days old.
